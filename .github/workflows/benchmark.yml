name: Benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: '4.0.10'
      - name: Install Fizzy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmysqlclient-dev libsqlite3-dev libvips-tools
      - name: Run the pinned corpus
        run: ruby script/benchmark_corpus.rb run benchmark-results/results.json
      - name: Graph benchmark history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          runs="$(gh run list --workflow benchmark.yml --branch main --status success --limit 10 --json databaseId,number \
            --jq "map(select(.number < $GITHUB_RUN_NUMBER)) | reverse | .[].databaseId")"
          history=()
          while read -r run; do
            [[ -n "$run" ]] || continue
            directory="$RUNNER_TEMP/ripr-benchmark-history/$run"
            if gh run download "$run" --name ripr-benchmarks --dir "$directory" && [[ -s "$directory/results.json" ]]; then
              history+=("$directory/results.json")
            fi
          done <<< "$runs"
          ruby script/benchmark_corpus.rb trend "${history[@]}" benchmark-results/results.json > benchmark-results/trend.md
          cat benchmark-results/trend.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ripr-benchmarks
          path: benchmark-results/
